syntax = "proto3";
package zchat;
import "base.proto";

option cc_generic_services = false;

message GetHistoryMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64 start_time = 3;
    int64 over_time = 4;
    optional string user_id = 5;
    optional string session_id = 6;
    optional int32 max_count = 7;       // 每页条数，缺省 50，上限 200
    optional string before_msg_id = 8;  // 游标：返回该 message_id 之前的消息，首页不传
}
message GetHistoryMsgRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3; 
    repeated MessageInfo msg_list = 4;
}

message GetRecentMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64 msg_count = 3;
    optional int64 cur_time = 4;//用于扩展获取指定时间前的n条消息
    optional string user_id = 5;
    optional string session_id = 6;
}
message GetRecentMsgRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3; 
    repeated MessageInfo msg_list = 4;
}

message MsgSearchReq {
    string request_id = 1;
    optional string user_id = 2;
    optional string session_id = 3;
    string chat_session_id = 4;
    string search_key = 5;
    optional int32 offset = 6;  // 搜索结果偏移，缺省 0
    optional int32 limit = 7;   // 每页条数，缺省 50，上限 100
}
message MsgSearchRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3; 
    repeated MessageInfo msg_list = 4;
}

message GetMultiRecentMsgReq {
    string request_id = 1;
    repeated string chat_session_id = 2;
    int64 msg_count = 3;
}
message GetMultiRecentMsgRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    map<string, MessageInfo> recent_messages = 4;
}

service MsgStorageService {
    rpc GetHistoryMsg(GetHistoryMsgReq) returns (GetHistoryMsgRsp);
    rpc GetRecentMsg(GetRecentMsgReq) returns (GetRecentMsgRsp);
    rpc GetMultiRecentMsg(GetMultiRecentMsgReq) returns (GetMultiRecentMsgRsp);
    rpc MsgSearch(MsgSearchReq) returns (MsgSearchRsp);
}