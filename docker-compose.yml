x-zchat-build: &zchat-build
  context: .
  dockerfile: server/Dockerfile.service
  args:
    BUILD_PRESET: ${ZCHAT_BUILD_PRESET:-conan2-release}

x-zchat-service-base: &zchat-service-base
  image: zchat-service:latest
  build: *zchat-build
  restart: always
  networks:
    - zchat-network

x-mysql-client-environment: &mysql-client-environment
  SSL_CERT_FILE: /etc/ssl/certs/zchat-mysql-ca.pem

x-docker-service-hosts: &docker-service-hosts
  ZCHAT_MYSQL_HOST: mysql
  ZCHAT_REDIS_HOST: redis
  ZCHAT_ETCD_HOST: etcd
  ZCHAT_RABBITMQ_HOST: rabbitmq
  ZCHAT_ES_HOST: elasticsearch

x-service-ports: &service-ports
  ZCHAT_SPEECH_SERVICE_PORT: ${ZCHAT_SPEECH_SERVICE_PORT:-10001}
  ZCHAT_FILE_SERVICE_PORT: ${ZCHAT_FILE_SERVICE_PORT:-10002}
  ZCHAT_USER_SERVICE_PORT: ${ZCHAT_USER_SERVICE_PORT:-10003}
  ZCHAT_TRANSMITE_SERVICE_PORT: ${ZCHAT_TRANSMITE_SERVICE_PORT:-10004}
  ZCHAT_MESSAGE_SERVICE_PORT: ${ZCHAT_MESSAGE_SERVICE_PORT:-10005}
  ZCHAT_FRIEND_SERVICE_PORT: ${ZCHAT_FRIEND_SERVICE_PORT:-10006}
  ZCHAT_GATEWAY_HTTP_PORT: ${ZCHAT_GATEWAY_HTTP_PORT:-8000}
  ZCHAT_GATEWAY_WEBSOCKET_PORT: ${ZCHAT_GATEWAY_WEBSOCKET_PORT:-8001}

x-mysql-ca-volume: &mysql-ca-volume
  type: bind
  source: ./server/certs/mysql/ca.pem
  target: /etc/ssl/certs/zchat-mysql-ca.pem
  read_only: true

x-grpc-certs-volume: &grpc-certs-volume
  type: bind
  source: ./server/certs/grpc
  target: /etc/ssl/certs/zchat-grpc
  read_only: true

x-grpc-tls-env: &grpc-tls-env
  ZCHAT_GRPC_CA_PATH: /etc/ssl/certs/zchat-grpc/ca.pem
  ZCHAT_GRPC_CERT_PATH: /etc/ssl/certs/zchat-grpc/server-cert.pem
  ZCHAT_GRPC_KEY_PATH: /etc/ssl/certs/zchat-grpc/server-key.pem
  ZCHAT_ETCD_TLS_CA_PATH: /etc/ssl/certs/zchat-grpc/ca.pem
  ZCHAT_ETCD_TLS_CERT_PATH: /etc/ssl/certs/zchat-grpc/server-cert.pem
  ZCHAT_ETCD_TLS_KEY_PATH: /etc/ssl/certs/zchat-grpc/server-key.pem
  ZCHAT_ES_TLS_CA_PATH: /etc/ssl/certs/zchat-grpc/ca.pem
  ZCHAT_RABBITMQ_TLS_CA_PATH: /etc/ssl/certs/zchat-grpc/ca.pem

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

services:
  mysql:
    image: mysql:8.4.9
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
    command:
      - --ssl-ca=/etc/mysql/ssl/ca.pem
      - --ssl-cert=/etc/mysql/ssl/server-cert.pem
      - --ssl-key=/etc/mysql/ssl/server-key.pem
      - --port=${ZCHAT_MYSQL_PORT:-3306}
    ports:
      - "127.0.0.1:${ZCHAT_MYSQL_PUBLISHED_PORT:-3306}:${ZCHAT_MYSQL_PORT:-3306}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./server/sql/01_user.sql:/docker-entrypoint-initdb.d/01_user.sql:ro
      - ./server/sql/02_friend.sql:/docker-entrypoint-initdb.d/02_friend.sql:ro
      - ./server/sql/03_message.sql:/docker-entrypoint-initdb.d/03_message.sql:ro
      - ./server/sql/04_file.sql:/docker-entrypoint-initdb.d/04_file.sql:ro
      - ./server/certs/mysql:/etc/mysql/ssl:ro
    secrets:
      - mysql_root_password
      - mysql_password
    networks:
      - zchat-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P \"$${ZCHAT_MYSQL_PORT:-3306}\" -uroot -p\"$$(cat \"$${MYSQL_ROOT_PASSWORD_FILE}\")\" --silent"]

  redis:
    image: redis:8.6.3-alpine
    restart: always
    environment:
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    command:
      - /bin/sh
      - -c
      - |
        if [ -s "$${ZCHAT_REDIS_PASSWORD_FILE}" ]; then
          redis_password="$$(cat "$${ZCHAT_REDIS_PASSWORD_FILE}")"
          exec redis-server --port "$${ZCHAT_REDIS_PORT:-6379}" --requirepass "$${redis_password}"
        fi
        exec redis-server --port "$${ZCHAT_REDIS_PORT:-6379}"
    ports:
      - "127.0.0.1:${ZCHAT_REDIS_PUBLISHED_PORT:-6379}:${ZCHAT_REDIS_PORT:-6379}"
    networks:
      - zchat-network
    secrets:
      - redis_password
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "if [ -s \"$${ZCHAT_REDIS_PASSWORD_FILE}\" ]; then redis-cli -p \"$${ZCHAT_REDIS_PORT:-6379}\" -a \"$$(cat \"$${ZCHAT_REDIS_PASSWORD_FILE}\")\" ping; else redis-cli -p \"$${ZCHAT_REDIS_PORT:-6379}\" ping; fi"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: always
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=https://etcd:${ZCHAT_ETCD_PORT:-2379}
      - --listen-client-urls=https://0.0.0.0:${ZCHAT_ETCD_PORT:-2379}
      - --cert-file=/etc/etcd/ssl/server-cert.pem
      - --key-file=/etc/etcd/ssl/server-key.pem
      - --trusted-ca-file=/etc/etcd/ssl/ca.pem
      - --client-cert-auth
    ports:
      - "127.0.0.1:${ZCHAT_ETCD_CLIENT_PUBLISHED_PORT:-2379}:${ZCHAT_ETCD_PORT:-2379}"
    volumes:
      - etcd-data:/etcd-data
      - ./server/certs/etcd:/etc/etcd/ssl:ro
    networks:
      - zchat-network
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "etcdctl",
          "endpoint",
          "health",
          "--endpoints=https://127.0.0.1:${ZCHAT_ETCD_PORT:-2379}",
          "--cacert=/etc/etcd/ssl/ca.pem",
          "--cert=/etc/etcd/ssl/server-cert.pem",
          "--key=/etc/etcd/ssl/server-key.pem"
        ]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      ZCHAT_RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_default_pass
      RABBITMQ_NODE_PORT: ${ZCHAT_RABBITMQ_PORT:-5671}
    command:
      - /bin/sh
      - -ec
      - |
        rabbitmq_password="$$(cat "$${ZCHAT_RABBITMQ_DEFAULT_PASS_FILE}")"
        {
          printf 'default_user = %s\n' "$${RABBITMQ_DEFAULT_USER}"
          printf 'default_pass = %s\n' "$${rabbitmq_password}"
          printf 'listeners.ssl.default = 5671\n'
          printf 'ssl_options.cacertfile = /etc/rabbitmq/ssl/ca.pem\n'
          printf 'ssl_options.certfile = /etc/rabbitmq/ssl/server-cert.pem\n'
          printf 'ssl_options.keyfile = /etc/rabbitmq/ssl/server-key.pem\n'
          printf 'ssl_options.verify = verify_peer\n'
          printf 'ssl_options.fail_if_no_peer_cert = false\n'
          printf 'management.ssl.port = 15671\n'
          printf 'management.ssl.cacertfile = /etc/rabbitmq/ssl/ca.pem\n'
          printf 'management.ssl.certfile = /etc/rabbitmq/ssl/server-cert.pem\n'
          printf 'management.ssl.keyfile = /etc/rabbitmq/ssl/server-key.pem\n'
        } > /etc/rabbitmq/conf.d/99-zchat-default-user.conf
        exec rabbitmq-server
    ports:
      - "127.0.0.1:${ZCHAT_RABBITMQ_PUBLISHED_PORT:-5671}:${ZCHAT_RABBITMQ_PORT:-5671}"
      - "127.0.0.1:${ZCHAT_RABBITMQ_MANAGEMENT_PUBLISHED_PORT:-15671}:15671"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./server/certs/rabbitmq:/etc/rabbitmq/ssl:ro
    secrets:
      - rabbitmq_default_pass
    networks:
      - zchat-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  elasticsearch:
    image: elasticsearch:8.8.2
    restart: always
    environment:
      discovery.type: single-node
      http.port: ${ZCHAT_ES_PORT:-9200}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/server-cert.pem
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/server-key.pem
      xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.pem
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/server-cert.pem
      xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/server-key.pem
      xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.pem
      ELASTIC_PASSWORD: ${ZCHAT_ELASTICSEARCH_PASSWORD:-changeme}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ZCHAT_ES_PUBLISHED_PORT:-9200}:${ZCHAT_ES_PORT:-9200}"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./server/certs/elasticsearch:/usr/share/elasticsearch/config/certs:ro
    networks:
      - zchat-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl --cacert /usr/share/elasticsearch/config/certs/ca.pem -u elastic:${ZCHAT_ELASTICSEARCH_PASSWORD:-changeme} --fail --silent https://127.0.0.1:${ZCHAT_ES_PORT:-9200}/_cluster/health >/dev/null"]

  file-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *mysql-client-environment, *grpc-tls-env]
      SERVICE_BINARY: zchat_file_service
      ZCHAT_ADVERTISE_HOST: file-service
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
    volumes:
      - *mysql-ca-volume
      - *grpc-certs-volume
    secrets:
      - mysql_password
      - redis_password
      - etcd_password
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_FILE_SERVICE_PORT:-10002}\""]

  speech-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *grpc-tls-env]
      SERVICE_BINARY: zchat_speech_service
      ZCHAT_ADVERTISE_HOST: speech-service
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
      ZCHAT_SPEECH_APP_ID: ${ZCHAT_SPEECH_APP_ID:-}
      ZCHAT_SPEECH_API_KEY_FILE: /run/secrets/speech_api_key
      ZCHAT_SPEECH_SECRET_KEY_FILE: /run/secrets/speech_secret_key
    secrets:
      - etcd_password
      - speech_api_key
      - speech_secret_key
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_SPEECH_SERVICE_PORT:-10001}\""]

  transmite-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *mysql-client-environment, *grpc-tls-env]
      SERVICE_BINARY: zchat_transmite_service
      ZCHAT_ADVERTISE_HOST: transmite-service
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
      ZCHAT_ES_PORT: ${ZCHAT_ES_PORT:-9200}
      ZCHAT_ELASTICSEARCH_USER: ${ZCHAT_ELASTICSEARCH_USER:-}
      ZCHAT_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      ZCHAT_RABBITMQ_PORT: ${ZCHAT_RABBITMQ_PORT:-5671}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_default_pass
    volumes:
      - *mysql-ca-volume
      - *grpc-certs-volume
    secrets:
      - mysql_password
      - redis_password
      - etcd_password
      - elasticsearch_password
      - rabbitmq_default_pass
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_TRANSMITE_SERVICE_PORT:-10004}\""]

  message-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *mysql-client-environment, *grpc-tls-env]
      SERVICE_BINARY: zchat_message_service
      ZCHAT_ADVERTISE_HOST: message-service
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
      ZCHAT_ES_PORT: ${ZCHAT_ES_PORT:-9200}
      ZCHAT_ELASTICSEARCH_USER: ${ZCHAT_ELASTICSEARCH_USER:-}
      ZCHAT_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      ZCHAT_RABBITMQ_PORT: ${ZCHAT_RABBITMQ_PORT:-5671}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_default_pass
    volumes:
      - *mysql-ca-volume
      - *grpc-certs-volume
    secrets:
      - mysql_password
      - etcd_password
      - elasticsearch_password
      - rabbitmq_default_pass
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_MESSAGE_SERVICE_PORT:-10005}\""]

  friend-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *mysql-client-environment, *grpc-tls-env]
      SERVICE_BINARY: zchat_friend_service
      ZCHAT_ADVERTISE_HOST: friend-service
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
      ZCHAT_ES_PORT: ${ZCHAT_ES_PORT:-9200}
      ZCHAT_ELASTICSEARCH_USER: ${ZCHAT_ELASTICSEARCH_USER:-}
      ZCHAT_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
    volumes:
      - *mysql-ca-volume
      - *grpc-certs-volume
    secrets:
      - mysql_password
      - redis_password
      - etcd_password
      - elasticsearch_password
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_FRIEND_SERVICE_PORT:-10006}\""]

  user-service:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *mysql-client-environment, *grpc-tls-env]
      SERVICE_BINARY: zchat_user_service
      ZCHAT_ADVERTISE_HOST: user-service
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zchat}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      ZCHAT_MYSQL_PORT: ${ZCHAT_MYSQL_PORT:-3306}
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
      ZCHAT_ES_PORT: ${ZCHAT_ES_PORT:-9200}
      ZCHAT_ELASTICSEARCH_USER: ${ZCHAT_ELASTICSEARCH_USER:-}
      ZCHAT_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      ZCHAT_SMS_ACCESS_KEY_ID_FILE: /run/secrets/sms_access_key_id
      ZCHAT_SMS_ACCESS_KEY_SECRET_FILE: /run/secrets/sms_access_key_secret
      ZCHAT_SMS_SIGN_NAME: ${ZCHAT_SMS_SIGN_NAME:-}
      ZCHAT_SMS_TEMPLATE_CODE: ${ZCHAT_SMS_TEMPLATE_CODE:-}
    volumes:
      - *mysql-ca-volume
      - *grpc-certs-volume
    secrets:
      - mysql_password
      - redis_password
      - etcd_password
      - elasticsearch_password
      - sms_access_key_id
      - sms_access_key_secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_USER_SERVICE_PORT:-10003}\""]

  gateway:
    <<: *zchat-service-base
    environment:
      <<: [*docker-service-hosts, *service-ports, *grpc-tls-env]
      SERVICE_BINARY: zchat_gateway
      ZCHAT_ADVERTISE_HOST: gateway
      ZCHAT_REDIS_PORT: ${ZCHAT_REDIS_PORT:-6379}
      ZCHAT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ZCHAT_ETCD_PORT: ${ZCHAT_ETCD_PORT:-2379}
      ZCHAT_ETCD_USERNAME: ${ZCHAT_ETCD_USERNAME:-}
      ZCHAT_ETCD_PASSWORD_FILE: /run/secrets/etcd_password
    volumes:
      - *grpc-certs-volume
    secrets:
      - redis_password
      - etcd_password
    ports:
      - "${ZCHAT_GATEWAY_HTTP_PUBLISHED_PORT:-8000}:${ZCHAT_GATEWAY_HTTP_PORT:-8000}"
      - "${ZCHAT_GATEWAY_WEBSOCKET_PUBLISHED_PORT:-8001}:${ZCHAT_GATEWAY_WEBSOCKET_PORT:-8001}"
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      file-service:
        condition: service_healthy
      speech-service:
        condition: service_healthy
      transmite-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      friend-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/'\"$${ZCHAT_GATEWAY_HTTP_PORT:-8000}\""]

networks:
  zchat-network:
    name: zchat-network
    driver: bridge

volumes:
  mysql-data:
  es-data:
  rabbitmq-data:
  etcd-data:

secrets:
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_FILE:?}
  mysql_password:
    file: ${MYSQL_PASSWORD_FILE:?}
  redis_password:
    file: ${ZCHAT_REDIS_PASSWORD_FILE:?}
  etcd_password:
    file: ${ZCHAT_ETCD_PASSWORD_FILE:?}
  elasticsearch_password:
    file: ${ZCHAT_ELASTICSEARCH_PASSWORD_FILE:?}
  rabbitmq_default_pass:
    file: ${RABBITMQ_DEFAULT_PASS_FILE:?}
  speech_api_key:
    file: ${ZCHAT_SPEECH_API_KEY_FILE:?}
  speech_secret_key:
    file: ${ZCHAT_SPEECH_SECRET_KEY_FILE:?}
  sms_access_key_id:
    file: ${ZCHAT_SMS_ACCESS_KEY_ID_FILE:?}
  sms_access_key_secret:
    file: ${ZCHAT_SMS_ACCESS_KEY_SECRET_FILE:?}
