version: '3.8'

services:
  # ============================================================================
  # 1. 基础设施服务（Infrastructure Services）
  # ============================================================================
  zchat-mysql:
    image: mysql:8.0
    container_name: zchat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zchat
      MYSQL_USER: testuser
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  zchat-redis:
    image: redis:7.0-alpine
    container_name: zchat-redis
    restart: always
    ports:
      - "6379:6379"

  zchat-etcd:
    image: bitnami/etcd:3.5
    container_name: zchat-etcd
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://zchat-etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"

  zchat-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zchat-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  zchat-elasticsearch:
    image: elasticsearch:8.8.2
    container_name: zchat-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # ============================================================================
  # 2. C++ 业务微服务群（zchat Microservices）
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: server/src/gateway/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-gateway
    restart: always
    environment:
      - ZCHAT_MYSQL_HOST=zchat-mysql
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_RABBITMQ_HOST=zchat-rabbitmq
      - ZCHAT_ES_HOST=zchat-elasticsearch
      - ZCHAT_ADVERTISE_HOST=gateway
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - zchat-etcd
      - zchat-redis

  user-service:
    build:
      context: .
      dockerfile: server/src/user/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-user-service
    restart: always
    environment:
      - ZCHAT_MYSQL_HOST=zchat-mysql
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_ES_HOST=zchat-elasticsearch
      - ZCHAT_ADVERTISE_HOST=user-service
    depends_on:
      - zchat-mysql
      - zchat-redis
      - zchat-etcd
      - zchat-elasticsearch

  friend-service:
    build:
      context: .
      dockerfile: server/src/friend/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-friend-service
    restart: always
    environment:
      - ZCHAT_MYSQL_HOST=zchat-mysql
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_ES_HOST=zchat-elasticsearch
      - ZCHAT_ADVERTISE_HOST=friend-service
    depends_on:
      - zchat-mysql
      - zchat-redis
      - zchat-etcd
      - zchat-elasticsearch

  message-service:
    build:
      context: .
      dockerfile: server/src/message/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-message-service
    restart: always
    environment:
      - ZCHAT_MYSQL_HOST=zchat-mysql
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_RABBITMQ_HOST=zchat-rabbitmq
      - ZCHAT_ES_HOST=zchat-elasticsearch
      - ZCHAT_ADVERTISE_HOST=message-service
    depends_on:
      - zchat-mysql
      - zchat-redis
      - zchat-etcd
      - zchat-rabbitmq
      - zchat-elasticsearch

  transmite-service:
    build:
      context: .
      dockerfile: server/src/transmite/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-transmite-service
    restart: always
    environment:
      - ZCHAT_MYSQL_HOST=zchat-mysql
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_RABBITMQ_HOST=zchat-rabbitmq
      - ZCHAT_ES_HOST=zchat-elasticsearch
      - ZCHAT_ADVERTISE_HOST=transmite-service
    depends_on:
      - zchat-mysql
      - zchat-redis
      - zchat-etcd
      - zchat-rabbitmq
      - zchat-elasticsearch

  speech-service:
    build:
      context: .
      dockerfile: server/src/speech/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-speech-service
    restart: always
    environment:
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_ADVERTISE_HOST=speech-service
    depends_on:
      - zchat-etcd

  file-service:
    build:
      context: .
      dockerfile: server/src/file/Dockerfile
      args:
        BUILD_PRESET: conan2-release
    container_name: zchat-file-service
    restart: always
    environment:
      - ZCHAT_REDIS_HOST=zchat-redis
      - ZCHAT_ETCD_HOST=zchat-etcd
      - ZCHAT_ADVERTISE_HOST=file-service
    depends_on:
      - zchat-redis
      - zchat-etcd

volumes:
  mysql-data:
  es-data:
